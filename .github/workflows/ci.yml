name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Build
        run: autoreconf -i && ./configure && make

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf
            autoconf
            automake
            make

      - name: Build
        run: autoreconf -i && ./configure && make

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^AC_INIT(\[rogueclone2s\],\[\([^]]*\)\].*/\1/p' configure.ac)" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src/rogue.exe dist/
          ldd src/rogue.exe | grep ucrt64 | awk '{print $3}' | xargs -I{} cp {} dist/
          cp msg/mesg msg/mesg_E dist/

      - uses: actions/upload-artifact@v7
        with:
          name: rogueclone2s-${{ steps.version.outputs.version }}-windows-x86_64
          path: dist/

  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@4807432c7cab1c3f97688665332c0b932062d31f # v1.4.3
        with:
          usesh: true
          prepare: pkg install -y autoconf automake
          run: autoreconf -i && ./configure && make

  build-haiku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^AC_INIT(\[rogueclone2s\],\[\([^]]*\)\].*/\1/p' configure.ac)" >> "$GITHUB_OUTPUT"

      - name: Start Haiku VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: haiku
          version: "r1beta6"

      - name: Build on Haiku
        shell: cpa.sh {0}
        run: |
          pkgman install -y ncurses6_devel autoconf automake make cmd:gcc
          autoreconf -i && ./configure && make
          mkdir -p dist
          cp src/rogue dist/
          cp msg/mesg msg/mesg_E dist/

      - uses: actions/upload-artifact@v7
        with:
          name: rogueclone2s-${{ steps.version.outputs.version }}-haiku-x86_64
          path: dist/
